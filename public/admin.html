<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Case Photos | J.K. Hospital Dental Care Center</title>
<style>
:root{--navy:#073b4c;--teal:#0b8f8f;--bg:#f7fbfb;--ink:#18323a;--muted:#60747b;--shadow:0 12px 35px rgba(7,59,76,.10)}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);padding:20px}
.wrap{max-width:760px;margin:auto}
h1{color:var(--navy);font-size:22px}
.box{background:white;border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
label{font-weight:700;font-size:13px;display:block;margin-bottom:6px;color:var(--navy)}
input,button{font:inherit;padding:12px 14px;border-radius:10px;border:1px solid #d8e4e6;width:100%;box-sizing:border-box}
button{background:var(--teal);color:white;font-weight:800;border:0;cursor:pointer;margin-top:10px}
button.danger{background:#d64545}
button.secondary{background:white;color:var(--navy);border:1px solid #d4e5e7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.item{background:white;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.item img{width:100%;height:120px;object-fit:cover;display:block}
.item .meta{padding:10px}
.item .meta p{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--navy)}
#msg{font-size:13px;margin-top:8px}
#loginBox,#panel{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
a.back{color:var(--teal);font-weight:700;font-size:13px;text-decoration:none}
.appt-card{background:white;border-radius:12px;box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.appt-card h4{margin:0 0 6px;color:var(--navy)}
.appt-card p{margin:2px 0;font-size:13px;color:var(--ink)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase}
.badge.pending{background:#fff3cd;color:#7a5b00}
.badge.confirmed{background:#d4f4dd;color:#0f6b2e}
.badge.cancelled{background:#fbdada;color:#a11c1c}
.appt-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.appt-actions button{width:auto;padding:8px 12px;font-size:12px;margin:0}
.faq-item{background:#fff;border:1px solid #e3eeee;border-radius:12px;padding:14px;margin-bottom:10px}.faq-item h4{margin:0 0 6px;color:var(--navy);font-size:14px}.faq-item p{margin:4px 0;font-size:13px;white-space:pre-wrap}.faq-meta{font-size:11px;color:var(--muted);margin-bottom:8px}.faq-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.faq-actions button{width:auto;margin:0;padding:8px 12px;font-size:12px}.faq-edit{display:none;background:#f7fbfb;border-radius:10px;padding:12px;margin-top:10px}.faq-edit input,.faq-edit textarea,.faq-edit select{margin-bottom:8px}.faq-edit textarea{min-height:100px}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<h1>Case Photos - Admin</h1>
<a class="back" href="/">← Back to website</a>
</div>

<div class="box" id="loginBox">
<label for="pw">Admin Password</label>
<input id="pw" type="password" placeholder="Enter password">
<button onclick="login()">Login</button>
<p id="loginMsg" style="color:#d64545;font-size:13px"></p>
</div>

<div id="panel">
<div class="box" style="display:flex;gap:10px;padding:14px">
<button id="tabCasesBtn" onclick="showTab('cases')" style="margin:0">Case Photos</button>
<button id="tabApptBtn" onclick="showTab('appt')" class="secondary" style="margin:0">Appointments</button>
<button id="tabVideosBtn" onclick="showTab('videos')" class="secondary" style="margin:0">Videos</button><button id="tabFaqBtn" onclick="showTab('faq')" class="secondary" style="margin:0">💬 FAQ Chat</button>
</div>

<div id="tabCases">
<div class="box">
<label for="fileInput">Add New Case Photo</label>
<input id="fileInput" type="file" accept="image/*">
<label for="label" style="margin-top:12px">Label (e.g. "Root Canal - Before & After")</label>
<input id="label" type="text" placeholder="Short description">
<button onclick="upload()">Upload Photo</button>
<p id="msg"></p>
</div>

<div class="box">
<label>Existing Photos</label>
<div class="grid" id="grid"><p style="color:var(--muted)">Loading...</p></div>
</div>
</div>

<div id="tabAppt" style="display:none">
<div class="box">
<label>Appointment Requests</label>
<div id="apptList"><p style="color:var(--muted)">Loading...</p></div>
</div>
</div>

<div id="tabVideos" style="display:none">
<div class="box">
<label for="videoUrl">YouTube Video Link</label>
<input id="videoUrl" type="text" placeholder="Paste YouTube video URL here">
<label for="videoTitle" style="margin-top:12px">Title (optional)</label>
<input id="videoTitle" type="text" placeholder="e.g. How to brush teeth correctly">
<button onclick="addVideo()">Add Video</button>
<p id="videoMsg"></p>
</div>
<div class="box">
<label>Existing Videos</label>
<div id="videosList"><p style="color:var(--muted)">Loading...</p></div>
</div>
</div>

<div id="tabFaq" style="display:none"><div class="box"><label>Question</label><input id="faqQuestion" type="text" placeholder="e.g. What are your clinic hours?"><label style="margin-top:12px">Answer</label><textarea id="faqAnswer" placeholder="Write the answer shown to patients..."></textarea><label>Category</label><input id="faqCategory" type="text" value="General"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Display Order</label><input id="faqOrder" type="number" value="0" min="0"></div><div><label>Active</label><select id="faqActive"><option value="1">Active</option><option value="0">Hidden</option></select></div></div><button onclick="addFaq()">➕ Add FAQ</button><p id="faqMsg"></p></div><div class="box"><label>Existing FAQs</label><div id="faqList"><p style="color:var(--muted)">Loading...</p></div></div></div>

<button class="secondary" onclick="logout()">Logout</button>
</div>

<script>
let TOKEN=sessionStorage.getItem("jkh_admin_pw")||"";

function show(el,on){document.getElementById(el).style.display=on?"block":"none";}

async function checkAuth(){
 if(!TOKEN){show("loginBox",true);show("panel",false);return;}
 const ok=await verify();
 if(ok){show("loginBox",false);show("panel",true);loadGrid();fetchApptBadgeCount();}
 else{TOKEN="";sessionStorage.removeItem("jkh_admin_pw");show("loginBox",true);show("panel",false);}
}

async function verify(){
 try{
  const res=await fetch("/api/admin/cases",{headers:{"Authorization":"Bearer "+TOKEN}});
  return res.status!==401;
 }catch(e){return false;}
}

async function login(){
 const pw=document.getElementById("pw").value;
 TOKEN=pw;
 const ok=await verify();
 if(ok){
  sessionStorage.setItem("jkh_admin_pw",TOKEN);
  document.getElementById("loginMsg").textContent="";
  show("loginBox",false);show("panel",true);loadGrid();fetchApptBadgeCount();
 }else{
  document.getElementById("loginMsg").textContent="Wrong password. Try again.";
 }
}

function logout(){
 TOKEN="";sessionStorage.removeItem("jkh_admin_pw");
 show("panel",false);show("loginBox",true);
}

async function loadGrid(){
 const grid=document.getElementById("grid");
 grid.innerHTML="Loading...";
 const res=await fetch("/api/admin/cases",{headers:{"Authorization":"Bearer "+TOKEN}});
 const data=await res.json();
 if(!data.length){grid.innerHTML='<p style="color:var(--muted)">No photos yet.</p>';return;}
 grid.innerHTML=data.map(c=>`<div class="item"><img src="${c.image}"><div class="meta"><p>${(c.label||'Untitled').replace(/</g,'&lt;')}</p><button class="danger" onclick="del(${c.id})">Delete</button></div></div>`).join("");
}

function fileToBase64(file){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  const reader=new FileReader();
  reader.onload=()=>{
   img.onload=()=>{
    const maxDim=1280;
    let w=img.width,h=img.height;
    if(w>h && w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
    else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
    const canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    canvas.getContext("2d").drawImage(img,0,0,w,h);
    resolve(canvas.toDataURL("image/jpeg",0.75));
   };
   img.onerror=reject;
   img.src=reader.result;
  };
  reader.onerror=reject;
  reader.readAsDataURL(file);
 });
}

async function upload(){
 const fileInput=document.getElementById("fileInput");
 const label=document.getElementById("label").value.trim();
 const msg=document.getElementById("msg");
 if(!fileInput.files[0]){msg.style.color="#d64545";msg.textContent="Please choose a photo first.";return;}
 msg.style.color="var(--muted)";msg.textContent="Uploading...";
 try{
  const base64=await fileToBase64(fileInput.files[0]);
  const res=await fetch("/api/admin/cases",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},
   body:JSON.stringify({image:base64,label})
  });
  if(!res.ok){
   const err=await res.json().catch(()=>({}));
   throw new Error(err.error||"Upload failed");
  }
  msg.style.color="#18a85b";msg.textContent="Uploaded successfully.";
  fileInput.value="";document.getElementById("label").value="";
  loadGrid();
 }catch(e){
  msg.style.color="#d64545";msg.textContent=e.message||"Upload failed. Try again.";
 }
}

async function del(id){
 if(!confirm("Delete this photo?"))return;
 await fetch("/api/admin/cases/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+TOKEN}});
 loadGrid();
}

function showTab(tab){
 document.getElementById("tabCases").style.display=tab==="cases"?"block":"none";
 document.getElementById("tabAppt").style.display=tab==="appt"?"block":"none";
 document.getElementById("tabVideos").style.display=tab==="videos"?"block":"none";
 document.getElementById("tabFaq").style.display=tab==="faq"?"block":"none";
 document.getElementById("tabCasesBtn").className=tab==="cases"?"":"secondary";
 document.getElementById("tabApptBtn").className=tab==="appt"?"":"secondary";
 document.getElementById("tabVideosBtn").className=tab==="videos"?"":"secondary";
 document.getElementById("tabFaqBtn").className=tab==="faq"?"":"secondary";
 if(tab==="appt")loadAppointments();
 if(tab==="videos")loadVideos();
 if(tab==="faq")loadFaqs();
}

async function loadFaqs(){const list=document.getElementById("faqList");list.innerHTML="Loading...";try{const r=await fetch("/api/admin/faqs",{headers:{"Authorization":"Bearer "+TOKEN}});if(!r.ok)throw 0;const data=await r.json();if(!data.length){list.innerHTML='<p style="color:var(--muted)">No FAQs yet.</p>';return}list.innerHTML=data.map(f=>`<div class="faq-item"><h4>${esc(f.question)}</h4><div class="faq-meta">${esc(f.category||"General")} · Order ${f.display_order||0} · ${f.active?"Active":"Hidden"}</div><p>${esc(f.answer)}</p><div class="faq-actions"><button class="secondary" onclick="toggleFaqEdit(${f.id})">✏️ Edit</button><button class="danger" onclick="deleteFaq(${f.id})">Delete</button></div><div class="faq-edit" id="faqEdit${f.id}"><input id="fq${f.id}" value="${escAttr(f.question)}"><textarea id="fa${f.id}">${esc(f.answer)}</textarea><input id="fc${f.id}" value="${escAttr(f.category||"General")}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="fo${f.id}" type="number" value="${Number(f.display_order)||0}" min="0"><select id="fx${f.id}"><option value="1" ${f.active?"selected":""}>Active</option><option value="0" ${!f.active?"selected":""}>Hidden</option></select></div><div class="faq-actions"><button onclick="updateFaq(${f.id})">Save Changes</button><button class="secondary" onclick="toggleFaqEdit(${f.id})">Cancel</button></div></div></div>`).join("")}catch(e){list.innerHTML='<p style="color:#d64545">Could not load FAQs.</p>'}}
function escAttr(s){return esc(s).replace(/`/g,"&#96;")}
function toggleFaqEdit(id){const e=document.getElementById("faqEdit"+id);e.style.display=e.style.display==="block"?"none":"block"}
async function addFaq(){const q=document.getElementById("faqQuestion").value.trim(),a=document.getElementById("faqAnswer").value.trim(),c=document.getElementById("faqCategory").value.trim()||"General",o=Number(document.getElementById("faqOrder").value)||0,active=document.getElementById("faqActive").value==="1",m=document.getElementById("faqMsg");if(!q||!a){m.style.color="#d64545";m.textContent="Question and answer are required.";return}m.style.color="var(--muted)";m.textContent="Saving...";try{const r=await fetch("/api/admin/faqs",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify({question:q,answer:a,category:c,display_order:o,active})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Failed to add FAQ.");m.style.color="#18a85b";m.textContent="FAQ added.";document.getElementById("faqQuestion").value="";document.getElementById("faqAnswer").value="";document.getElementById("faqCategory").value="General";document.getElementById("faqOrder").value="0";document.getElementById("faqActive").value="1";loadFaqs()}catch(e){m.style.color="#d64545";m.textContent=e.message}}
async function updateFaq(id){const q=document.getElementById("fq"+id).value.trim(),a=document.getElementById("fa"+id).value.trim(),c=document.getElementById("fc"+id).value.trim()||"General",o=Number(document.getElementById("fo"+id).value)||0,active=document.getElementById("fx"+id).value==="1";if(!q||!a){alert("Question and answer are required.");return}const r=await fetch("/api/admin/faqs/"+id,{method:"PATCH",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:JSON.stringify({question:q,answer:a,category:c,display_order:o,active})});if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.error||"Could not update FAQ.");return}loadFaqs()}
async function deleteFaq(id){if(!confirm("Delete this FAQ?"))return;await fetch("/api/admin/faqs/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+TOKEN}});loadFaqs()}
function extractYouTubeId(url){
 const patterns=[
  /(?:youtube\.com\/watch\?v=)([^&\s]+)/,
  /(?:youtu\.be\/)([^?&\s]+)/,
  /(?:youtube\.com\/embed\/)([^?&\s]+)/,
  /(?:youtube\.com\/shorts\/)([^?&\s]+)/
 ];
 for(const p of patterns){const m=url.match(p); if(m) return m[1];}
 if(/^[\w-]{11}$/.test(url.trim())) return url.trim();
 return null;
}

async function loadVideos(){
 const list=document.getElementById("videosList");
 list.innerHTML="Loading...";
 const res=await fetch("/api/admin/videos",{headers:{"Authorization":"Bearer "+TOKEN}});
 const data=await res.json();
 if(!data.length){list.innerHTML='<p style="color:var(--muted)">No videos added yet.</p>';return;}
 list.innerHTML=data.map(v=>`<div class="appt-card"><h4>${(v.title||'Untitled').replace(/</g,'&lt;')}</h4><p style="word-break:break-all;color:var(--muted)">youtube.com/watch?v=${v.youtube_id}</p><div class="appt-actions"><button class="danger" onclick="delVideo(${v.id})">Delete</button></div></div>`).join("");
}

async function addVideo(){
 const url=document.getElementById("videoUrl").value.trim();
 const title=document.getElementById("videoTitle").value.trim();
 const msg=document.getElementById("videoMsg");
 const youtube_id=extractYouTubeId(url);
 if(!youtube_id){msg.style.color="#d64545";msg.textContent="Could not read a valid YouTube link. Please check and try again.";return;}
 msg.style.color="var(--muted)";msg.textContent="Adding...";
 try{
  const res=await fetch("/api/admin/videos",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},
   body:JSON.stringify({youtube_id,title})
  });
  if(!res.ok)throw new Error("Failed");
  msg.style.color="#18a85b";msg.textContent="Video added.";
  document.getElementById("videoUrl").value="";document.getElementById("videoTitle").value="";
  loadVideos();
 }catch(e){
  msg.style.color="#d64545";msg.textContent="Failed to add video.";
 }
}

async function delVideo(id){
 if(!confirm("Remove this video?"))return;
 await fetch("/api/admin/videos/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+TOKEN}});
 loadVideos();
}

async function loadAppointments(){
 const list=document.getElementById("apptList");
 list.innerHTML="Loading...";
 const res=await fetch("/api/admin/appointments",{headers:{"Authorization":"Bearer "+TOKEN}});
 const data=await res.json();
 const todayStr=new Date().toISOString().slice(0,10);
 const todays=data.filter(a=>a.pref_date===todayStr && a.status!=='cancelled').sort((a,b)=>(a.pref_time||'').localeCompare(b.pref_time||''));
 updateApptBadge(todays.length);
 if(!data.length){list.innerHTML='<p style="color:var(--muted)">No appointment requests yet.</p>';return;}
 let html='';
 if(todays.length){
  html+=`<div style="background:#fff3cd;border:1px solid #ffe69c;border-radius:12px;padding:14px;margin-bottom:16px">
   <h4 style="margin:0 0 10px;color:#7a5b00">🔔 Today's Appointments (${todayStr}) — ${todays.length}</h4>
   ${todays.map(a=>`<div style="padding:8px 0;border-top:1px solid #ffe69c;display:flex;justify-content:space-between;gap:10px">
    <span><b>${esc(a.name)}</b> — ${esc(a.service||'-')}<br><span style="font-size:12px;color:#7a5b00">📞 ${esc(a.phone)} • ${esc(a.patient_type||'-')}</span></span>
    <span style="font-weight:800;color:#7a5b00">🕒 ${esc(a.pref_time||'-')}</span>
   </div>`).join('')}
  </div>`;
 }
 html+=data.map(a=>`
  <div class="appt-card">
   <h4>${esc(a.name)} <span class="badge ${a.status}">${a.status}</span></h4>
   <p>📞 ${esc(a.phone)} &nbsp;•&nbsp; ${esc(a.patient_type||'-')}</p>
   <p>🦷 ${esc(a.service||'-')}</p>
   <p>📅 ${esc(a.pref_date||'-')} &nbsp; 🕒 ${esc(a.pref_time||'-')}</p>
   ${a.message?`<p>📝 ${esc(a.message)}</p>`:""}
   <div class="appt-actions">
    <button onclick="setStatus(${a.id},'confirmed','${esc(a.phone)}','${esc(a.name)}','${esc(a.pref_date||'')}','${esc(a.pref_time||'')}')" style="background:#0b8f8f;color:#fff">Confirm</button>
    <button onclick="setStatus(${a.id},'cancelled')" style="background:#d64545;color:#fff">Cancel</button>
    <button onclick="delAppt(${a.id})" style="background:white;color:var(--navy);border:1px solid #d4e5e7">Delete</button>
    <button onclick="toggleNotes(${a.id})" style="background:white;color:var(--teal);border:1px solid #d4e5e7">Notes</button>
   </div>
   <div id="notes-${a.id}" style="display:none;margin-top:12px;border-top:1px solid #eef3f3;padding-top:10px">
    <div id="notesList-${a.id}" style="font-size:13px;margin-bottom:8px"></div>
    <input id="noteInput-${a.id}" placeholder="Add a note..." style="margin-bottom:6px">
    <button onclick="addNote(${a.id})" style="background:var(--teal);color:#fff;width:auto;padding:8px 14px;font-size:12px">Add Note</button>
   </div>
  </div>`).join("");
 list.innerHTML=html;
}

async function fetchApptBadgeCount(){
 try{
  const res=await fetch("/api/admin/appointments",{headers:{"Authorization":"Bearer "+TOKEN}});
  const data=await res.json();
  const todayStr=new Date().toISOString().slice(0,10);
  const count=data.filter(a=>a.pref_date===todayStr && a.status!=='cancelled').length;
  updateApptBadge(count);
 }catch(e){}
}

function updateApptBadge(count){
 const btn=document.getElementById("tabApptBtn");
 let badge=document.getElementById("apptBadge");
 if(!badge){
  badge=document.createElement("span");
  badge.id="apptBadge";
  badge.style.cssText="background:#d64545;color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;margin-left:6px";
  btn.appendChild(badge);
 }
 badge.textContent=count;
 badge.style.display=count>0?"inline-block":"none";
}

function toggleNotes(id){
 const el=document.getElementById("notes-"+id);
 const open=el.style.display==="block";
 el.style.display=open?"none":"block";
 if(!open)loadNotes(id);
}

async function loadNotes(id){
 const container=document.getElementById("notesList-"+id);
 container.innerHTML="Loading...";
 const res=await fetch(`/api/admin/appointments/${id}/notes`,{headers:{"Authorization":"Bearer "+TOKEN}});
 const notes=await res.json();
 if(!notes.length){container.innerHTML='<p style="color:var(--muted)">No notes yet.</p>';return;}
 container.innerHTML=notes.map(n=>`<p style="margin:4px 0;padding:8px;background:var(--bg);border-radius:8px">${esc(n.note)}<br><span style="color:var(--muted);font-size:11px">${new Date(n.created_at).toLocaleString()}</span></p>`).join("");
}

async function addNote(id){
 const input=document.getElementById("noteInput-"+id);
 const note=input.value.trim();
 if(!note)return;
 await fetch(`/api/admin/appointments/${id}/notes`,{
  method:"POST",
  headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},
  body:JSON.stringify({note})
 });
 input.value="";
 loadNotes(id);
}

function esc(s){return String(s).replace(/</g,"&lt;");}

async function setStatus(id,status,phone,name,date,time){
 await fetch("/api/admin/appointments/"+id,{
  method:"PATCH",
  headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},
  body:JSON.stringify({status})
 });
 loadAppointments();
 if(status==="confirmed" && phone){
  const text=`Hello ${encodeURIComponent(name)}, your appointment at J.K. Hospital Dental Care Center is confirmed for ${encodeURIComponent(date)} at ${encodeURIComponent(time)}. See you then!`;
  window.open(`https://wa.me/91${phone.replace(/\D/g,"").slice(-10)}?text=${text}`,"_blank");
 }
}

async function delAppt(id){
 if(!confirm("Delete this appointment request?"))return;
 await fetch("/api/admin/appointments/"+id,{method:"DELETE",headers:{"Authorization":"Bearer "+TOKEN}});
 loadAppointments();
}

checkAuth();
</script>
</body>
</html>
